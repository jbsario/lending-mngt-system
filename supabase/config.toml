[functions.send-sms]
# Platform-level JWT verification is OFF on purpose: with it on, CORS
# preflight (OPTIONS) requests — which browsers send with no Authorization
# header — get rejected before the function's own code ever runs, breaking
# every browser call. This is Supabase's own documented pattern for
# functions that need both CORS support and auth: verify_jwt = false here,
# and index.ts does its own explicit auth.getUser() check instead.
verify_jwt = false

[functions.sms-scheduler]
# Also off, but for a different reason than send-sms: this function has no
# browser caller at all (it's invoked by pg_cron, not the app), so there's
# no CORS preflight to worry about. It's off so the platform doesn't reject
# calls before index.ts's own explicit service-role-key check runs — that
# check (not this setting) is what actually protects it from being called
# by a random request.
verify_jwt = false
